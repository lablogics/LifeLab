name: lifelab_core
description: Core infrastructure for LifeLab (API, DB, auth, sync)
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.12.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0
  
  # API
  dio: ^5.4.0
  
  # Local database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  
  # Security
  flutter_secure_storage: ^9.0.0
  
  # Utils
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0
  isar_generator: ^3.1.0+1
  json_serializable: ^6.7.0
  mocktail: ^1.0.0

name: lifelab
description: Flutter mobile client for LifeOS API
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  
  # Local packages
  lifelab_core:
    path: packages/lifelab_core
  lifelab_ui:
    path: packages/lifelab_ui
  
  # State management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0
  
  # Navigation
  go_router: ^13.0.0
  flutter_secure_storage: ^9.0.0
  url_launcher: ^6.2.0
  crypto: ^3.0.3
  
  # Media
  image_picker: ^1.0.0
  file_picker: ^9.0.0
  open_file: ^3.3.0
  
  # Push notifications
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^18.0.0
  
  # UI
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#6750A4"
  adaptive_icon_foreground: "assets/app_icon.png"
  min_sdk_android: 21

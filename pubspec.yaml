name: lifelab
description: Flutter mobile client for LifeOS API
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  
  # Local packages
  lifelab_core:
    path: packages/lifelab_core
  lifelab_ui:
    path: packages/lifelab_ui
  
  # State management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0
  
  # Navigation
  go_router: ^13.0.0
  
  # UI
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true
